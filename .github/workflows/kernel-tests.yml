name: Living World Kernel Tests

on:
  push:
    branches:
      - 'feat/**'
  pull_request:

jobs:
  kernel-0a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Godot version
        run: godot --version

      - name: Run Living World Kernel 0A tests
        run: godot --headless --path . --script res://tests/kernel_0a_test.gd
